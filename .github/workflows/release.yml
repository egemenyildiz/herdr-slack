name: release

on:
  push:
    branches: [main]
  # Retrying by hand matters because release-please keeps its state in the
  # release PR's labels. If a run dies after tagging but before it can swap
  # `autorelease: pending` for `autorelease: tagged` — a cancelled run, or the
  # billing block that stopped every job here on 2026-08-16 — then every later
  # run retries the same release and fails with "Duplicate release tag". Without
  # a manual trigger the only way out is an empty commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# release-please opens a release PR, which also needs the repo setting
# "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General → Workflow permissions). Without it the run
# fails with "GitHub Actions is not permitted to create or approve pull
# requests". Enable via:
#   gh api -X PUT repos/OWNER/REPO/actions/permissions/workflow \
#     -f default_workflow_permissions=read -F can_approve_pull_request_reviews=true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # herdr installs from a repo and pins with `--ref`, so real tags matter.
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
