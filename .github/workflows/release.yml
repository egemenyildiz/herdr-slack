name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # herdr installs from a repo and pins with `--ref`, so real tags matter.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
